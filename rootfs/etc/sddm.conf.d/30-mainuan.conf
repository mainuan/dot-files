# Mainuan: tela de login com o tema Breeze e a identidade do Mainuan.
# Lido depois de 20-kubuntu.conf (kubuntu-settings-desktop), que escolhe o
# tema "kubuntu"; aqui só os valores que mudam.
[Theme]
Current=breeze
# Rosto padrão de quem ainda não escolheu um (o SDDM não lê ~/.face.icon
# de contas novas): o logotipo do Mainuan.
FacesDir=/usr/share/mainuan-desktop-defaults/sddm-faces
