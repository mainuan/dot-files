# Tema do GRUB do Mainuan (pacote mainuan-grub-theme).
#
# Lido pelo update-grub depois de /etc/default/grub. As opções só valem
# enquanto o tema estiver instalado; depois de mudar algo, rode
# "sudo update-grub".
if [ -f /boot/grub/themes/mainuan/theme.txt ]; then
    GRUB_THEME=/boot/grub/themes/mainuan/theme.txt
    # 1920x1080 quando o monitor aceita (o tema foi desenhado para ela; em
    # telas 2K/4K fica do mesmo tamanho); senão, a resolução do firmware.
    GRUB_GFXMODE=1920x1080,auto
    # Mostra o menu por 3 segundos (no Kubuntu ele fica escondido).
    GRUB_TIMEOUT_STYLE=menu
    GRUB_TIMEOUT=3
    # Lista outros sistemas instalados (Windows, outras distribuições).
    GRUB_DISABLE_OS_PROBER=false
fi
