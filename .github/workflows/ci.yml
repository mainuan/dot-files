name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  package:
    permissions:
      contents: write # only the release job uses it, and only for v* tags
    uses: mainuan/.github/.github/workflows/debian-package.yml@2409a50535befe90ac3bbfc4db6eed7d65eac4e5
    with:
      package: mainuan-desktop-defaults
      release-title: Mainuan Desktop Defaults
      test-command: |
        sh -n debian/mainuan-user-avatar.preinst
        sh -n debian/mainuan-user-avatar.postrm
        sh -n debian/mainuan-grub-theme.postinst
        sh -n debian/mainuan-grub-theme.postrm
        sh -n rootfs/etc/default/grub.d/60-mainuan-theme.cfg
        # The boot artwork generator must keep working (run on a copy; the
        # committed images are the reviewed ones).
        rm -rf /tmp/boot-art && cp -r . /tmp/boot-art
        python3 /tmp/boot-art/tools/boot-art/generate.py
        test "$(ls /tmp/boot-art/rootfs/usr/share/plymouth/themes/mainuan/throbber-*.png | wc -l)" = 48
        rm -rf /tmp/boot-art
        # The source package must not carry .git or build leftovers.
        dpkg-source -Zgzip -z1 --build .
        tar -tzf ../mainuan-desktop-defaults_*.tar.gz > ../source-files.txt
        if grep -E '(^|/)\.git(/|$)|/debian/(\.debhelper|debhelper-build-stamp|files$|.*\.substvars$|mainuan-desktop-defaults/|mainuan-user-avatar/)' ../source-files.txt; then
          echo "::error::source package carries VCS or build files"; exit 1
        fi
        du -h ../mainuan-desktop-defaults_*.tar.gz
        rm -f ../mainuan-desktop-defaults_*.dsc ../mainuan-desktop-defaults_*.tar.gz ../source-files.txt
      # kubuntu-settings-desktop first (it also brings plasma-workspace): the
      # main package must install next to it without touching its files.
      # The diversions of mainuan-user-avatar are tested in the job below.
      extra-install-packages: kubuntu-settings-desktop kpackagetool6 libkf6config-bin desktop-file-utils python3
      smoke-command: |
        cd "$HOME"
        # This package replaces nothing: Kubuntu's files stay untouched.
        if dpkg-divert --list | grep mainuan; then exit 1; fi
        dpkg --verify mainuan-desktop-defaults kubuntu-settings-desktop
        dpkg -S /etc/skel/.face | grep -qx 'kubuntu-settings-desktop: /etc/skel/.face'
        dpkg -S /usr/share/plasma/avatars/kubuntu-bug.png | grep -q '^kubuntu-settings-desktop:'
        test -s /usr/share/plasma/avatars/logoMainuan.png
        python3 -I - <<'PY'
        import configparser, json, os, subprocess
        for d in ("ChatAI-Plasmoid", "com.mike.desktop", "org.kde.plasma.powershowdesktop"):
            path = f"/usr/share/plasma/plasmoids/{d}/"
            with open(path + "metadata.json", encoding="utf-8") as f:
                plugin = json.load(f)["KPlugin"]
            assert plugin["Id"] == d and plugin["Name"], d
            assert os.path.isfile(path + "contents/ui/main.qml"), d
        ours = subprocess.run(["dpkg", "-L", "mainuan-desktop-defaults"], check=True,
                              capture_output=True, text=True).stdout.splitlines()
        configs = [p for p in ours if p.startswith("/etc/skel/.config/") or p == "/etc/xdg/kscreenlockerrc"]
        assert len(configs) == 15, configs
        # KConfig files (gtkrc and gtkrc-2.0 use the GTK syntax).
        for path in (p for p in configs if not os.path.basename(p).startswith("gtkrc")):
            # allow_no_value: KConfig deletion markers ("Key[$d]") have no "=".
            c = configparser.ConfigParser(interpolation=None, strict=False, allow_no_value=True)
            c.optionxform = str
            with open(path, encoding="utf-8") as f:
                c.read_file(f)
            print(path, len(c.sections()), "groups")
        PY
        # Effective values with Kubuntu's configuration directory in the
        # cascade, as in a Kubuntu session.
        export XDG_CONFIG_DIRS=/etc/xdg:/usr/share/kubuntu-default-settings/kf5-settings
        img="$(kreadconfig6 --file kscreenlockerrc --group Greeter --group Wallpaper --group org.kde.image --group General --key Image)"
        echo "lock screen: $img"
        test "$img" = file:///usr/share/wallpapers/01ciano.png
        img="$(kreadconfig6 --file /etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc --group Containments --group 455 --group Wallpaper --group org.kde.image --group General --key Image)"
        echo "desktop: $img"
        test "$img" = file:///usr/share/wallpapers/01ciano.png
        kpackagetool6 --global --type Plasma/Applet --list > applets.txt
        for id in ChatAI-Plasmoid com.mike.desktop org.kde.plasma.powershowdesktop; do
          grep -qwF -- "$id" applets.txt || { cat applets.txt; exit 1; }
        done
        if dpkg -L mainuan-desktop-defaults | grep -E '/plasmoids/[^/]+/(translate|locale|images|[^/]*\.plasmoid)$|/(LICENSE|README)[^/]*$'; then exit 1; fi
        # Boot splash: the Mainuan theme is the default and its animation exists.
        update-alternatives --query default.plymouth | grep -qx 'Value: /usr/share/plymouth/themes/mainuan/mainuan.plymouth'
        test -s /usr/share/plymouth/themes/mainuan/throbber-0001.png
        test "$(ls /usr/share/plymouth/themes/mainuan/throbber-*.png | wc -l)" = 48
        # The last frame stays until SDDM takes the display.
        grep -qx 'ExecStart=-/usr/bin/plymouth quit --retain-splash' \
          /usr/lib/systemd/system/plymouth-quit.service.d/50-mainuan-retain-splash.conf
        # New accounts start with the Mainuan Plasma splash.
        grep -qx 'Theme=org.mainuan.splash' /etc/skel/.config/ksplashrc
        # Real files: the initramfs hook does not follow links out of the theme.
        if find /usr/share/plymouth/themes/mainuan -type l | grep .; then exit 1; fi
        update-alternatives --query text.plymouth | grep -qx 'Value: /usr/share/plymouth/themes/mainuan-text/mainuan-text.plymouth'
        grep -qx 'title=Mainuan 2027.1' /usr/share/plymouth/themes/mainuan-text/mainuan-text.plymouth
        test -s /usr/share/plymouth/themes/mainuan/watermark.png
        # The Mainuan logo, not the Spinner (Ubuntu) watermark.
        if [ -e /usr/share/plymouth/themes/spinner/watermark.png ]; then
          ! cmp -s /usr/share/plymouth/themes/{mainuan,spinner}/watermark.png
        fi
        # Login screen: Breeze theme (after Kubuntu's 20-kubuntu.conf) and the
        # Mainuan logo as the default face.
        test "$(ls /etc/sddm.conf.d | tail -1)" = 30-mainuan.conf
        grep -qx 'Current=breeze' /etc/sddm.conf.d/30-mainuan.conf
        test "$(readlink -f /usr/share/mainuan-desktop-defaults/sddm-faces/.face.icon)" = /usr/share/plasma/avatars/logoMainuan.png
        grep -qx 'background=/usr/share/wallpapers/01ciano.png' /usr/share/sddm/themes/breeze/theme.conf.user
        test -s /usr/share/sddm/themes/breeze/Main.qml

  # mainuan-user-avatar diverts two kubuntu-settings-desktop files. The
  # shared install test only covers the main package (and its dpkg -L check
  # does not understand diversion lines), so this job tests, as root and
  # without --force-conf*, both installation orders, reinstalling both
  # packages, and byte-for-byte restoration on remove and purge.
  # mainuan-grub-theme and mainuan-plasma-splash: install next to their
  # real consumers, check the files, the GRUB fonts named by theme.txt and
  # the KPackage, then reinstall, remove and purge without leftovers.
  boot-packages:
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ubuntu:26.04@sha256:42527649dbc4f9197a6073f426f488cbff0e9cc9f2afce32d91c383e4875634a
      options: --platform linux/amd64
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-mainuan-desktop-defaults-${{ github.sha }}
          path: dist

      - name: Install, check, remove and purge
        run: |
          set -euo pipefail
          rm -f /etc/dpkg/dpkg.cfg.d/excludes
          (cd dist && sha256sum --check SHA256SUMS)
          grub="$(echo "$PWD"/dist/mainuan-grub-theme_*.deb)"
          splash="$(echo "$PWD"/dist/mainuan-plasma-splash_*.deb)"
          apt=(apt-get --yes --no-install-recommends)
          apt-get update
          "${apt[@]}" install grub-common plasma-workspace kpackagetool6
          T=/usr/share/grub/themes/mainuan

          check() {
            # Fonts referenced by theme.txt exist and carry that exact name.
            grep -o '"Noto Sans[^"]*"' $T/theme.txt | sort -u | tr -d '"' | while read -r font; do
              f="$T/$(echo "$font" | tr 'A-Z ' 'a-z_').pf2"
              test -s "$f"
              head -c 120 "$f" | grep -aq "$font"
            done
            # Every file named by theme.txt exists.
            grep -o '"[^"]*\.png"' $T/theme.txt | tr -d '"' | while read -r img; do
              case $img in
                *'*'*) ls $T/${img%%\**}*.png >/dev/null ;;
                *) test -s "$T/$img" ;;
              esac
            done
            test -s $T/icons/mainuan.png
            # Copy in /boot (readable by GRUB) and the guarded options.
            cmp $T/theme.txt /boot/grub/themes/mainuan/theme.txt
            test "$(ls /boot/grub/themes/mainuan/*.pf2 | wc -l)" = 4
            sh -n /etc/default/grub.d/60-mainuan-theme.cfg
            ( . /etc/default/grub.d/60-mainuan-theme.cfg
              test "$GRUB_THEME" = /boot/grub/themes/mainuan/theme.txt
              test "$GRUB_TIMEOUT_STYLE" = menu )
            # Plasma splash: a LookAndFeel KPackage with a splash.
            kpackagetool6 --type Plasma/LookAndFeel --list | grep -qx 'org.mainuan.splash'
            test -s /usr/share/plasma/look-and-feel/org.mainuan.splash/contents/splash/Splash.qml
            test -s /usr/share/plasma/look-and-feel/org.mainuan.splash/contents/previews/splash.png
            dpkg --verify mainuan-grub-theme mainuan-plasma-splash
          }

          "${apt[@]}" install "$grub" "$splash"
          check
          "${apt[@]}" install --reinstall "$grub" "$splash"
          check
          "${apt[@]}" remove mainuan-grub-theme mainuan-plasma-splash
          test ! -e /boot/grub/themes/mainuan
          test ! -e $T
          # The conffile stays after remove, but without the theme it changes nothing.
          ( . /etc/default/grub.d/60-mainuan-theme.cfg; test -z "${GRUB_THEME:-}" )
          dpkg --purge mainuan-grub-theme mainuan-plasma-splash
          test ! -e /etc/default/grub.d/60-mainuan-theme.cfg
          test ! -e /usr/share/plasma/look-and-feel/org.mainuan.splash
          if kpackagetool6 --type Plasma/LookAndFeel --list | grep -x 'org.mainuan.splash'; then exit 1; fi

  diversions:
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ubuntu:26.04@sha256:42527649dbc4f9197a6073f426f488cbff0e9cc9f2afce32d91c383e4875634a
      options: --platform linux/amd64
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-mainuan-desktop-defaults-${{ github.sha }}
          path: dist

      - name: Divert, keep and restore the Kubuntu files (mainuan-user-avatar)
        run: |
          set -euo pipefail
          rm -f /etc/dpkg/dpkg.cfg.d/excludes
          (cd dist && sha256sum --check SHA256SUMS)
          deb="$(echo "$PWD"/dist/mainuan-user-avatar_*.deb)"
          main="$(echo "$PWD"/dist/mainuan-desktop-defaults_*.deb)"
          # No --force-conf*: a conffile prompt (stdin is closed) fails the job.
          apt=(apt-get --yes --no-install-recommends)
          D=/var/lib/mainuan-user-avatar/diverted
          ours="$(mktemp -d)"
          dpkg-deb -x "$deb" "$ours"
          sum() { sha256sum < "$1" | cut -d' ' -f1; }
          step() { echo "::group::$*"; }

          apt-get update
          "${apt[@]}" install kubuntu-settings-desktop sddm-theme-breeze
          kface="$(sum /etc/skel/.face)"
          kbug="$(sum /usr/share/plasma/avatars/kubuntu-bug.png)"
          bface=/usr/share/sddm/themes/breeze/faces/.face.icon
          kbface="$(sum $bface)"

          diverted() {  # Mainuan files in place, Kubuntu's kept aside
            for f in /etc/skel/.face /usr/share/plasma/avatars/kubuntu-bug.png; do
              test "$(dpkg-divert --listpackage "$f")" = mainuan-user-avatar
            done
            test "$(readlink /etc/skel/.face)" = /usr/share/mainuan-user-avatar/face.svg
            test "$(readlink -f /etc/skel/.face.icon)" = /usr/share/mainuan-user-avatar/face.svg
            grep -q '<svg' /etc/skel/.face
            test "$(sum /usr/share/plasma/avatars/kubuntu-bug.png)" = "$(sum "$ours/usr/share/plasma/avatars/kubuntu-bug.png")"
            test "$(sum $D/skel.face)" = "$kface"
            test "$(sum $D/kubuntu-bug.png)" = "$kbug"
            # SDDM login face: Breeze's own face is diverted to the Mainuan logo.
            test "$(dpkg-divert --listpackage $bface)" = mainuan-user-avatar
            test "$(readlink -f $bface)" = /usr/share/plasma/avatars/kubuntu-bug.png
            test "$(sum $D/breeze.face.icon)" = "$kbface"
            dpkg --verify kubuntu-settings-desktop sddm-theme-breeze mainuan-user-avatar
          }
          restored() {  # Kubuntu files back, no diversion, nothing left
            test -f /etc/skel/.face && test ! -L /etc/skel/.face
            test "$(sum /etc/skel/.face)" = "$kface"
            test "$(sum /usr/share/plasma/avatars/kubuntu-bug.png)" = "$kbug"
            test "$(readlink -f /etc/skel/.face.icon)" = /etc/skel/.face
            test -f $bface && test ! -L $bface
            test "$(sum $bface)" = "$kbface"
            test ! -e /var/lib/mainuan-user-avatar
            test ! -e /usr/share/mainuan-user-avatar
            if dpkg-divert --list | grep mainuan; then exit 1; fi
            dpkg --verify kubuntu-settings-desktop sddm-theme-breeze
          }

          step "Kubuntu first, then Mainuan (with mainuan-desktop-defaults); reinstall"
          "${apt[@]}" install "$main" "$deb"
          diverted
          "${apt[@]}" install --reinstall kubuntu-settings-desktop
          diverted
          "${apt[@]}" install --reinstall "$deb"
          diverted
          echo "::endgroup::"

          step "remove restores the Kubuntu files; purge leaves nothing"
          "${apt[@]}" remove mainuan-user-avatar
          restored
          dpkg --purge mainuan-user-avatar
          restored
          dpkg --verify mainuan-desktop-defaults
          echo "::endgroup::"

          step "Mainuan first, then Kubuntu"
          "${apt[@]}" purge kubuntu-settings-desktop
          test ! -e /etc/skel/.face
          "${apt[@]}" install "$deb"
          test ! -e $D/skel.face
          "${apt[@]}" install kubuntu-settings-desktop
          diverted
          "${apt[@]}" install --reinstall kubuntu-settings-desktop
          diverted
          "${apt[@]}" remove mainuan-user-avatar
          dpkg --purge mainuan-user-avatar
          restored
          echo "::endgroup::"
