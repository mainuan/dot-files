name: CI

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  package:
    permissions:
      contents: write # only the release job uses it, and only for v* tags
    uses: mainuan/.github/.github/workflows/debian-package.yml@2409a50535befe90ac3bbfc4db6eed7d65eac4e5
    with:
      package: mainuan-desktop-defaults
      release-title: Mainuan Desktop Defaults
      test-command: |
        sh -n debian/mainuan-user-avatar.preinst
        sh -n debian/mainuan-user-avatar.postinst
        sh -n debian/mainuan-user-avatar.postrm
        # Identity: manifest, checksums and service in sync; the postrm knows
        # the sha256 of the /etc/skel/.face it may delete.
        python3 identity/update-manifest.py --check
        python3 -I -c 'import ast, sys; [ast.parse(open(f).read(), f) for f in sys.argv[1:]]' \
          identity/mainuan-identity-restore identity/update-manifest.py identity/test_restore.py
        grep -qx "FACE_SHA256=$(sha256sum < identity/files/avatars/cyan.svg | cut -d' ' -f1)" \
          debian/mainuan-user-avatar.postrm
        # Unprivileged --check of a root with nothing installed: every entry
        # is skipped (no Mainuan package owns or diverts the destinations).
        mkdir -p /tmp/idroot/usr/share/mainuan && cp -r identity/files /tmp/idroot/usr/share/mainuan/identity
        python3 -I identity/mainuan-identity-restore --check --root /tmp/idroot | tee /tmp/idcheck.txt
        grep -q '4 ignoradas' /tmp/idcheck.txt
        rm -rf /tmp/idroot /tmp/idcheck.txt
        sh -n debian/mainuan-grub-theme.postinst
        sh -n debian/mainuan-grub-theme.postrm
        sh -n rootfs/etc/default/grub.d/60-mainuan-theme.cfg
        # The boot artwork generator must keep working (run on a copy; the
        # committed images are the reviewed ones).
        rm -rf /tmp/boot-art && cp -r . /tmp/boot-art
        python3 /tmp/boot-art/tools/boot-art/generate.py
        test "$(ls /tmp/boot-art/rootfs/usr/share/plymouth/themes/mainuan/throbber-*.png | wc -l)" = 48
        rm -rf /tmp/boot-art
        # The source package must not carry .git or build leftovers.
        dpkg-source -Zgzip -z1 --build .
        tar -tzf ../mainuan-desktop-defaults_*.tar.gz > ../source-files.txt
        if grep -E '(^|/)\.git(/|$)|/debian/(\.debhelper|debhelper-build-stamp|files$|.*\.substvars$|mainuan-desktop-defaults/|mainuan-user-avatar/|mainuan-identity/)' ../source-files.txt; then
          echo "::error::source package carries VCS or build files"; exit 1
        fi
        du -h ../mainuan-desktop-defaults_*.tar.gz
        rm -f ../mainuan-desktop-defaults_*.dsc ../mainuan-desktop-defaults_*.tar.gz ../source-files.txt
      # kubuntu-settings-desktop first (it also brings plasma-workspace): the
      # main package must install next to it without touching its files.
      # The diversions of mainuan-user-avatar are tested in the job below.
      extra-install-packages: kubuntu-settings-desktop kpackagetool6 libkf6config-bin desktop-file-utils python3
      smoke-command: |
        cd "$HOME"
        # This package replaces nothing: Kubuntu's files stay untouched.
        if dpkg-divert --list | grep mainuan; then exit 1; fi
        dpkg --verify mainuan-desktop-defaults kubuntu-settings-desktop
        dpkg -S /etc/skel/.face | grep -qx 'kubuntu-settings-desktop: /etc/skel/.face'
        dpkg -S /usr/share/plasma/avatars/kubuntu-bug.png | grep -q '^kubuntu-settings-desktop:'
        test -s /usr/share/plasma/avatars/logoMainuan.png
        python3 -I - <<'PY'
        import configparser, json, os, subprocess
        for d in ("ChatAI-Plasmoid", "com.mike.desktop", "org.kde.plasma.powershowdesktop"):
            path = f"/usr/share/plasma/plasmoids/{d}/"
            with open(path + "metadata.json", encoding="utf-8") as f:
                plugin = json.load(f)["KPlugin"]
            assert plugin["Id"] == d and plugin["Name"], d
            assert os.path.isfile(path + "contents/ui/main.qml"), d
        ours = subprocess.run(["dpkg", "-L", "mainuan-desktop-defaults"], check=True,
                              capture_output=True, text=True).stdout.splitlines()
        configs = [p for p in ours if p.startswith("/etc/skel/.config/") or p == "/etc/xdg/kscreenlockerrc"]
        assert len(configs) == 14, configs
        # KConfig files (gtkrc and gtkrc-2.0 use the GTK syntax).
        for path in (p for p in configs if not os.path.basename(p).startswith("gtkrc")):
            # allow_no_value: KConfig deletion markers ("Key[$d]") have no "=".
            c = configparser.ConfigParser(interpolation=None, strict=False, allow_no_value=True)
            c.optionxform = str
            with open(path, encoding="utf-8") as f:
                c.read_file(f)
            print(path, len(c.sections()), "groups")
        PY
        # Effective values with Kubuntu's configuration directory in the
        # cascade, as in a Kubuntu session.
        export XDG_CONFIG_DIRS=/etc/xdg:/usr/share/kubuntu-default-settings/kf5-settings
        img="$(kreadconfig6 --file kscreenlockerrc --group Greeter --group Wallpaper --group org.kde.image --group General --key Image)"
        echo "lock screen: $img"
        test "$img" = file:///usr/share/wallpapers/01ciano.png
        img="$(kreadconfig6 --file /etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc --group Containments --group 455 --group Wallpaper --group org.kde.image --group General --key Image)"
        echo "desktop: $img"
        test "$img" = file:///usr/share/wallpapers/01ciano.png
        kpackagetool6 --global --type Plasma/Applet --list > applets.txt
        for id in ChatAI-Plasmoid com.mike.desktop org.kde.plasma.powershowdesktop; do
          grep -qwF -- "$id" applets.txt || { cat applets.txt; exit 1; }
        done
        if dpkg -L mainuan-desktop-defaults | grep -E '/plasmoids/[^/]+/(translate|locale|images|[^/]*\.plasmoid)$|/(LICENSE|README)[^/]*$'; then exit 1; fi
        # Boot splash: the Mainuan theme is the default and its animation exists.
        update-alternatives --query default.plymouth | grep -qx 'Value: /usr/share/plymouth/themes/mainuan/mainuan.plymouth'
        test -s /usr/share/plymouth/themes/mainuan/throbber-0001.png
        test "$(ls /usr/share/plymouth/themes/mainuan/throbber-*.png | wc -l)" = 48
        # The last frame stays until SDDM takes the display.
        grep -qx 'ExecStart=-/usr/bin/plymouth quit --retain-splash' \
          /usr/lib/systemd/system/plymouth-quit.service.d/50-mainuan-retain-splash.conf
        # Application launcher with the Mainuan logo and Laetum Control Center
        # in place of KDE Control Station (new accounts); existing accounts get
        # the logo once through a Plasma update script.
        A=/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc
        grep -qx 'icon=mainuan' $A && grep -qx 'plugin=local.laetum.controlcenter' $A
        if grep -q KdeControlStation $A; then exit 1; fi
        test -s /usr/share/icons/hicolor/scalable/apps/mainuan.svg
        test -s /usr/share/plasma/shells/org.kde.plasma.desktop/contents/updates/mainuan-launcher-icon.js
        grep -qx 'DefaultDarkLookAndFeel=Dream-Dark-Color-Global-6' /etc/xdg/kdeglobals
        # Installer slideshow: translatable QML, images without text, catalogs.
        V=/etc/calamares/branding/vendor
        grep -q 'qsTr("Welcome to Mainuan")' $V/show.qml
        test "$(ls $V/images/slide-*.png | wc -l)" = 5
        if ls $V/slides_*.png 2>/dev/null; then exit 1; fi
        test "$(ls $V/lang/calamares-vendor_*.qm | wc -l)" -ge 33
        # Calamares catalogs with fixed %N placeholders (read before the
        # built-in copies): pt_BR summary says "fuso horário para %1".
        test "$(ls /usr/share/calamares/lang/calamares_*.qm | wc -l)" = 9
        python3 -c "import sys; d=open('/usr/share/calamares/lang/calamares_pt_BR.qm','rb').read(); sys.exit(not ('Definir o fuso horário para %1.'.encode('utf-16-be') in d and 'Configure timezone para 1'.encode('utf-16-be') not in d))"
        # System default global theme (Kubuntu's comes after /etc/xdg).
        grep -qx 'LookAndFeelPackage=org.mainuan.desktop' /etc/xdg/kdeglobals
        test "$(XDG_CONFIG_DIRS=/etc/xdg:/usr/share/kubuntu-default-settings/kf5-settings kreadconfig6 --file kdeglobals --group KDE --key LookAndFeelPackage)" = org.mainuan.desktop
        # Real files: the initramfs hook does not follow links out of the theme.
        if find /usr/share/plymouth/themes/mainuan -type l | grep .; then exit 1; fi
        update-alternatives --query text.plymouth | grep -qx 'Value: /usr/share/plymouth/themes/mainuan-text/mainuan-text.plymouth'
        grep -qx 'title=Mainuan 2027.1' /usr/share/plymouth/themes/mainuan-text/mainuan-text.plymouth
        test -s /usr/share/plymouth/themes/mainuan/watermark.png
        # The Mainuan logo, not the Spinner (Ubuntu) watermark.
        if [ -e /usr/share/plymouth/themes/spinner/watermark.png ]; then
          ! cmp -s /usr/share/plymouth/themes/{mainuan,spinner}/watermark.png
        fi
        # Login screen: Breeze theme (after Kubuntu's 20-kubuntu.conf) and the
        # Mainuan logo as the default face.
        test "$(ls /etc/sddm.conf.d | tail -1)" = 30-mainuan.conf
        grep -qx 'Current=breeze' /etc/sddm.conf.d/30-mainuan.conf
        test "$(readlink -f /usr/share/mainuan-desktop-defaults/sddm-faces/.face.icon)" = /usr/share/plasma/avatars/logoMainuan.png
        grep -qx 'background=/usr/share/wallpapers/01ciano.png' /usr/share/sddm/themes/breeze/theme.conf.user
        test -s /usr/share/sddm/themes/breeze/Main.qml

  # mainuan-user-avatar diverts two kubuntu-settings-desktop files. The
  # shared install test only covers the main package (and its dpkg -L check
  # does not understand diversion lines), so this job tests, as root and
  # without --force-conf*, both installation orders, reinstalling both
  # packages, and byte-for-byte restoration on remove and purge.
  # mainuan-grub-theme and mainuan-plasma-splash: install next to their
  # real consumers, check the files, the GRUB fonts named by theme.txt and
  # the KPackage, then reinstall, remove and purge without leftovers.
  boot-packages:
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ubuntu:26.04@sha256:42527649dbc4f9197a6073f426f488cbff0e9cc9f2afce32d91c383e4875634a
      options: --platform linux/amd64
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-mainuan-desktop-defaults-${{ github.sha }}
          path: dist

      - name: Install, check, remove and purge
        run: |
          set -euo pipefail
          rm -f /etc/dpkg/dpkg.cfg.d/excludes
          (cd dist && sha256sum --check SHA256SUMS)
          grub="$(echo "$PWD"/dist/mainuan-grub-theme_*.deb)"
          splash="$(echo "$PWD"/dist/mainuan-plasma-splash_*.deb)"
          apt=(apt-get --yes --no-install-recommends)
          apt-get update
          "${apt[@]}" install grub-common plasma-workspace kpackagetool6
          T=/usr/share/grub/themes/mainuan

          check() {
            # Fonts referenced by theme.txt exist and carry that exact name.
            grep -o '"Noto Sans[^"]*"' $T/theme.txt | sort -u | tr -d '"' | while read -r font; do
              f="$T/$(echo "$font" | tr 'A-Z ' 'a-z_').pf2"
              test -s "$f"
              head -c 120 "$f" | grep -aq "$font"
            done
            # Every file named by theme.txt exists.
            grep -o '"[^"]*\.png"' $T/theme.txt | tr -d '"' | while read -r img; do
              case $img in
                *'*'*) ls $T/${img%%\**}*.png >/dev/null ;;
                *) test -s "$T/$img" ;;
              esac
            done
            test -s $T/icons/mainuan.png
            # Copy in /boot (readable by GRUB) and the guarded options.
            cmp $T/theme.txt /boot/grub/themes/mainuan/theme.txt
            test "$(ls /boot/grub/themes/mainuan/*.pf2 | wc -l)" = 4
            sh -n /etc/default/grub.d/60-mainuan-theme.cfg
            ( . /etc/default/grub.d/60-mainuan-theme.cfg
              test "$GRUB_THEME" = /boot/grub/themes/mainuan/theme.txt
              test "$GRUB_TIMEOUT_STYLE" = menu )
            # Plasma splash: a LookAndFeel KPackage with a splash.
            kpackagetool6 --global --type Plasma/LookAndFeel --list | grep -qwF org.mainuan.desktop
            test -s /usr/share/plasma/look-and-feel/org.mainuan.desktop/contents/splash/Splash.qml
            test -s /usr/share/plasma/look-and-feel/org.mainuan.desktop/contents/previews/splash.png
            test -s /usr/share/plasma/look-and-feel/org.mainuan.desktop/contents/previews/preview.png
            grep -qx 'Theme=org.mainuan.desktop' /usr/share/plasma/look-and-feel/org.mainuan.desktop/contents/defaults
            dpkg --verify mainuan-grub-theme mainuan-plasma-splash
          }

          "${apt[@]}" install "$grub" "$splash"
          check
          "${apt[@]}" install --reinstall "$grub" "$splash"
          check
          "${apt[@]}" remove mainuan-grub-theme mainuan-plasma-splash
          test ! -e /boot/grub/themes/mainuan
          test ! -e $T
          # The conffile stays after remove, but without the theme it changes nothing.
          ( . /etc/default/grub.d/60-mainuan-theme.cfg; test -z "${GRUB_THEME:-}" )
          dpkg --purge mainuan-grub-theme mainuan-plasma-splash
          test ! -e /etc/default/grub.d/60-mainuan-theme.cfg
          test ! -e /usr/share/plasma/look-and-feel/org.mainuan.desktop
          if kpackagetool6 --global --type Plasma/LookAndFeel --list | grep -wF org.mainuan.desktop; then exit 1; fi

  diversions:
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: ubuntu:26.04@sha256:42527649dbc4f9197a6073f426f488cbff0e9cc9f2afce32d91c383e4875634a
      options: --platform linux/amd64
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-mainuan-desktop-defaults-${{ github.sha }}
          path: dist

      - name: Divert, keep and restore the Kubuntu files (mainuan-user-avatar)
        run: |
          set -euo pipefail
          rm -f /etc/dpkg/dpkg.cfg.d/excludes
          (cd dist && sha256sum --check SHA256SUMS)
          deb="$(echo "$PWD"/dist/mainuan-user-avatar_*.deb)"
          identity="$(echo "$PWD"/dist/mainuan-identity_*.deb)"
          main="$(echo "$PWD"/dist/mainuan-desktop-defaults_*.deb)"
          # No --force-conf*: a conffile prompt (stdin is closed) fails the job.
          apt=(apt-get --yes --no-install-recommends)
          D=/var/lib/mainuan-user-avatar/diverted
          ours="$(mktemp -d)"
          dpkg-deb -x "$deb" "$ours"
          sum() { sha256sum < "$1" | cut -d' ' -f1; }
          step() { echo "::group::$*"; }

          apt-get update
          "${apt[@]}" install kubuntu-settings-desktop sddm-theme-breeze curl ca-certificates
          # Published version with /etc/skel/.face as a link (upgrade test).
          OLD=/tmp/mainuan-user-avatar_2026.11.18.2_all.deb
          curl -fsSL -o "$OLD" https://github.com/mainuan/dot-files/releases/download/v2026.11.18.2/mainuan-user-avatar_2026.11.18.2_all.deb
          echo "93c97ae3fd1a10042227ebd25b04e936135647959eabffafa09d605462b3354e  $OLD" | sha256sum --check
          kface="$(sum /etc/skel/.face)"
          kbug="$(sum /usr/share/plasma/avatars/kubuntu-bug.png)"
          bface=/usr/share/sddm/themes/breeze/faces/.face.icon
          kbface="$(sum $bface)"

          diverted() {  # Mainuan files in place, Kubuntu's kept aside
            for f in /etc/skel/.face /usr/share/plasma/avatars/kubuntu-bug.png; do
              test "$(dpkg-divert --listpackage "$f")" = mainuan-user-avatar
            done
            # A regular root:root 0644 file (not a link out of the home),
            # identical to the official avatar of mainuan-identity.
            test -f /etc/skel/.face && test ! -L /etc/skel/.face
            test "$(stat -c '%U:%G %a' /etc/skel/.face)" = 'root:root 644'
            cmp /etc/skel/.face /usr/share/mainuan/identity/avatars/cyan.svg
            test "$(readlink -f /etc/skel/.face.icon)" = /etc/skel/.face
            if dpkg -S /etc/skel/.face | grep '^mainuan-user-avatar:'; then exit 1; fi
            /usr/libexec/mainuan-identity/mainuan-identity-restore --check
            # A new account gets a regular ~/.face it owns.
            useradd --create-home --shell /bin/bash "u$((++users))"
            test -f "/home/u$users/.face" && test ! -L "/home/u$users/.face"
            test "$(stat -c %U "/home/u$users/.face")" = "u$users"
            userdel --remove "u$users" 2>/dev/null || true
            test "$(sum /usr/share/plasma/avatars/kubuntu-bug.png)" = "$(sum "$ours/usr/share/plasma/avatars/kubuntu-bug.png")"
            test "$(sum $D/skel.face)" = "$kface"
            test "$(sum $D/kubuntu-bug.png)" = "$kbug"
            # SDDM login face: Breeze's own face is diverted to the Mainuan logo.
            test "$(dpkg-divert --listpackage $bface)" = mainuan-user-avatar
            test "$(readlink -f $bface)" = /usr/share/plasma/avatars/kubuntu-bug.png
            test "$(sum $D/breeze.face.icon)" = "$kbface"
            dpkg --verify kubuntu-settings-desktop sddm-theme-breeze mainuan-user-avatar
          }
          restored() {  # Kubuntu files back, no diversion, nothing left
            test -f /etc/skel/.face && test ! -L /etc/skel/.face
            test "$(sum /etc/skel/.face)" = "$kface"
            test "$(sum /usr/share/plasma/avatars/kubuntu-bug.png)" = "$kbug"
            test "$(readlink -f /etc/skel/.face.icon)" = /etc/skel/.face
            test -f $bface && test ! -L $bface
            test "$(sum $bface)" = "$kbface"
            test ! -e /var/lib/mainuan-user-avatar
            test ! -e /usr/share/mainuan-user-avatar
            if ls -A /etc/skel | grep mainuan; then exit 1; fi
            if dpkg-divert --list | grep mainuan; then exit 1; fi
            dpkg --verify kubuntu-settings-desktop sddm-theme-breeze
          }

          users=0
          step "Kubuntu first, then Mainuan (with mainuan-desktop-defaults); reinstall"
          "${apt[@]}" install "$main" "$identity" "$deb"
          diverted
          # Restoration: the boot service puts back a removed or altered
          # file only where a Mainuan package installed or diverted it.
          R=/usr/libexec/mainuan-identity/mainuan-identity-restore
          rm /etc/skel/.face
          echo corrompido > /usr/share/plasma/avatars/logoMainuan.png
          chmod 0600 /usr/share/icons/hicolor/scalable/apps/mainuan.svg
          rc=0; $R --check || rc=$?; test "$rc" = 1
          $R | tee restore.log
          grep -q '3 restauradas' restore.log
          $R | tee restore.log
          grep -q '4 conformes, 0 restauradas' restore.log
          diverted
          dpkg --verify mainuan-desktop-defaults
          "${apt[@]}" install --reinstall kubuntu-settings-desktop
          diverted
          "${apt[@]}" install --reinstall "$deb"
          diverted
          echo "::endgroup::"

          step "remove restores the Kubuntu files; purge leaves nothing"
          "${apt[@]}" remove mainuan-user-avatar
          restored
          # Without mainuan-user-avatar the slot is Kubuntu's again: skipped.
          $R | tee restore.log
          grep -q '2 ignoradas' restore.log
          restored
          dpkg --purge mainuan-user-avatar
          restored
          dpkg --verify mainuan-desktop-defaults
          echo "::endgroup::"

          step "Mainuan first, then Kubuntu"
          "${apt[@]}" purge kubuntu-settings-desktop
          test ! -e /etc/skel/.face
          "${apt[@]}" install "$identity" "$deb"
          test ! -e $D/skel.face
          test -f /etc/skel/.face && cmp /etc/skel/.face /usr/share/mainuan/identity/avatars/cyan.svg
          "${apt[@]}" install kubuntu-settings-desktop
          diverted
          "${apt[@]}" install --reinstall kubuntu-settings-desktop
          diverted
          "${apt[@]}" remove mainuan-user-avatar
          dpkg --purge mainuan-user-avatar
          restored
          echo "::endgroup::"

          step "upgrade from the published 2026.11.18.2 (link in /etc/skel)"
          "${apt[@]}" install "$OLD"
          test "$(readlink /etc/skel/.face)" = /usr/share/mainuan-user-avatar/face.svg
          "${apt[@]}" install "$identity" "$deb"
          diverted
          test ! -e /usr/share/mainuan-user-avatar
          "${apt[@]}" remove mainuan-user-avatar mainuan-identity
          dpkg --purge mainuan-user-avatar mainuan-identity
          restored
          test ! -e /usr/share/mainuan/identity
          test ! -e /usr/libexec/mainuan-identity
          echo "::endgroup::"

  # mainuan-identity-restore as root on temporary roots (--root): missing,
  # corrupted, intact (no write), wrong mode/owner, symlinks in the target
  # and in parent directories, missing directory, rejected manifests,
  # personal files in /home untouched, second run without changes.
  identity-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      image: ubuntu:26.04@sha256:42527649dbc4f9197a6073f426f488cbff0e9cc9f2afce32d91c383e4875634a
      options: --platform linux/amd64
    permissions:
      contents: read
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restoration tests (root, temporary roots)
        run: |
          set -eu
          apt-get update
          apt-get install --yes --no-install-recommends python3
          python3 -I identity/test_restore.py

  # The real service under systemd (PID 1 in a privileged container): the
  # hardened unit runs at install and at boot, restores, refuses a planted
  # symlink, never touches /home; remove and purge leave nothing.
  identity-systemd:
    needs: package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb-mainuan-desktop-defaults-${{ github.sha }}
          path: dist

      - name: Boot Ubuntu 26.04 with systemd
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS)
          cat > Dockerfile <<'EOF'
          FROM ubuntu:26.04@sha256:42527649dbc4f9197a6073f426f488cbff0e9cc9f2afce32d91c383e4875634a
          ENV DEBIAN_FRONTEND=noninteractive
          RUN rm -f /etc/dpkg/dpkg.cfg.d/excludes /usr/sbin/policy-rc.d && apt-get update && \
              apt-get install --yes --no-install-recommends systemd systemd-sysv dbus python3 passwd
          STOPSIGNAL SIGRTMIN+3
          CMD ["/sbin/init"]
          EOF
          docker build --platform linux/amd64 -t mainuan-systemd .
          docker run -d --name sd --platform linux/amd64 --privileged --cgroupns=private \
            --tmpfs /run --tmpfs /run/lock -v "$PWD/dist:/dist:ro" mainuan-systemd
          for i in $(seq 60); do
            state="$(docker exec sd systemctl is-system-running 2>/dev/null || true)"
            case "$state" in running|degraded) break ;; esac
            sleep 2
          done
          echo "system: $state"
          docker exec sd systemctl --failed --no-pager || true

      - name: Install, restore at boot, refuse a symlink, remove and purge
        run: |
          set -euxo pipefail
          x() { docker exec sd bash -euo pipefail -c "$*"; }
          U=mainuan-identity-restore.service
          R=/usr/libexec/mainuan-identity/mainuan-identity-restore
          result() { x "systemctl show -P Result $U"; }
          x 'apt-get install --yes --no-install-recommends /dist/mainuan-identity_*.deb /dist/mainuan-user-avatar_*.deb'
          echo "::group::installed: enabled, ran once, hardened"
          test "$(x "systemctl is-enabled $U")" = enabled
          # Started by the postinst (deb-systemd-invoke): it ran once.
          test "$(result)" = success
          test "$(x "systemctl show -P ExecMainStartTimestampMonotonic $U")" != 0
          x "systemctl show -P Before $U" | tr ' ' '\n' | grep -qx display-manager.service
          x "systemctl show -p ProtectSystem -p ProtectHome -p ReadWritePaths -p NoNewPrivileges -p PrivateTmp -p CapabilityBoundingSet $U"
          x "systemd-analyze security --no-pager $U | tail -n 1"
          x "journalctl -b -u $U --no-pager -o cat"
          x 'test -f /etc/skel/.face && test ! -L /etc/skel/.face && cmp /etc/skel/.face /usr/share/mainuan/identity/avatars/cyan.svg'
          echo "::endgroup::"

          echo "::group::restore through the service; /home untouched; second run writes nothing"
          x 'useradd --create-home ana && echo pessoal > /home/ana/.face && chown ana: /home/ana/.face'
          before="$(x 'stat -c "%i %Y %Z %s" /home/ana/.face; sha256sum /home/ana/.face')"
          x 'rm /etc/skel/.face; echo corrompido > /usr/share/plasma/avatars/kubuntu-bug.png'
          x "systemctl start $U"
          test "$(result)" = success
          x "journalctl -u $U --no-pager -o cat | tail -n 4"
          x "$R --check"
          x "cmp /usr/share/plasma/avatars/kubuntu-bug.png /usr/share/mainuan/identity/logo/mainuan-logo.png"
          stamp="$(x 'stat -c "%i %Y %Z" /etc/skel/.face /usr/share/plasma/avatars/kubuntu-bug.png')"
          x "systemctl start $U"
          last="$(x "journalctl -u $U --no-pager -o cat | grep entradas | tail -n 1")"
          echo "$last" | grep '2 conformes, 0 restauradas'
          test "$(x 'stat -c "%i %Y %Z" /etc/skel/.face /usr/share/plasma/avatars/kubuntu-bug.png')" = "$stamp"
          test "$(x 'stat -c "%i %Y %Z %s" /home/ana/.face; sha256sum /home/ana/.face')" = "$before"
          echo "::endgroup::"

          echo "::group::planted symlink: refused, the target stays as it was"
          x 'echo segredo > /root/alvo && rm /etc/skel/.face && ln -s /root/alvo /etc/skel/.face'
          if x "systemctl start $U"; then exit 1; fi
          test "$(result)" = exit-code
          x "journalctl -u $U --no-pager -o cat | tail -n 3"
          x 'test -L /etc/skel/.face && test "$(cat /root/alvo)" = segredo'
          x 'rm /etc/skel/.face'
          echo "::endgroup::"

          echo "::group::runs at boot, before the login screen"
          docker restart sd
          for i in $(seq 60); do
            state="$(docker exec sd systemctl is-system-running 2>/dev/null || true)"
            case "$state" in running|degraded) break ;; esac
            sleep 2
          done
          x "journalctl -b -u $U --no-pager -o cat"
          test "$(result)" = success
          x 'test -f /etc/skel/.face && test ! -L /etc/skel/.face'
          test "$(x 'stat -c "%i %Y %Z %s" /home/ana/.face; sha256sum /home/ana/.face')" = "$before"
          echo "::endgroup::"

          echo "::group::remove and purge: service disabled, nothing left"
          x 'apt-get remove --yes mainuan-user-avatar mainuan-identity'
          x 'dpkg --purge mainuan-user-avatar mainuan-identity'
          if x "systemctl cat $U" 2>/dev/null; then exit 1; fi
          if x 'find /etc/systemd -name "mainuan-identity*" | grep .'; then exit 1; fi
          if x 'dpkg-divert --list | grep mainuan'; then exit 1; fi
          x 'test ! -e /usr/share/mainuan && test ! -e /usr/libexec/mainuan-identity && test ! -e /var/lib/mainuan-user-avatar'
          x 'test ! -e /etc/skel/.face && ! ls -A /etc/skel | grep mainuan'
          x 'test "$(cat /home/ana/.face)" = pessoal'
          echo "::endgroup::"
